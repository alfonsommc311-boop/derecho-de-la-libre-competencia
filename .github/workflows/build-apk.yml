name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore: ['*.md', '_brief/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar lecciones
        run: cd assets/web && node ../../scripts/validate_lessons.js
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: libre-competencia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk libre-competencia.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest libre-competencia.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Libre Competencia PRO (APK)" --prerelease \
            --notes "APK de la última compilación de la rama ${GITHUB_REF_NAME}. Descárgalo desde el celular y ábrelo para instalar."
