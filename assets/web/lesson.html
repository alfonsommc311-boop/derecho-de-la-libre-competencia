<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cargando…</title>
<meta name="theme-color" content="#15191c">

<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← Inicio</a>
    <span class="tt" id="tt"></span>
  </div>
  <div class="lesson-wrap"><div id="lesson"></div></div>

<script src="assets/catalog.js"></script>
<script src="assets/engine.js"></script>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var name = (p.get('l') || '').replace(/[^a-z0-9\-]/gi, '');
    if (!name) { document.getElementById('lesson').innerHTML = '<div class="err">Lección no especificada.</div>'; return; }
    window.__lesson = name;
    window.addEventListener('pagehide', function () { try { Speak.stop(); } catch (e) {} });
    var s = document.createElement('script');
    s.src = 'lessons/' + name + '.js';
    s.onerror = function () { document.getElementById('lesson').innerHTML = '<div class="err">No se encontró la lección: ' + name + '</div>'; };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
